// 1 - Включить / 0 - Выключить | Отладочные логи в addons/sourcemod/logs/VIP_WeaponPack.log
// -
// Default: "0"
c_Debug "0"

// 1 - Включить / 0 - Выключить | Отвечает за работу плагина
// -
// Default: "1"
c_Enabled "1"

// 1 - Блокировать пистолетный раунд (в каждой половине при mp_halftime) / 0 - Разрешить
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
c_FirstRound "1"

// 0 - Старый режим: меню не открывается при блокировках | 1 - Меню всегда открывается, недоступные пункты скрыты по round | 2 - Меню всегда открывает
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "2.000000"
c_MenuDisplay "2"

// 0 - Время выдачи = mp_buytime | >0 - Свое время выдачи (секунды) с начала раунда
// -
// Default: "0"
// Minimum: "0.000000"
c_MenuTime "10"

// 0 - Можно использовать всегда (кроме пистолетного, если c_FirstRound=1) | 1+ - Через сколько раундов после взятия снова доступно меню
// -
// Default: "0"
// Minimum: "0.000000"
c_RoundLimit "0"

// 1 - Включить / 0 - Выключить | Выводит менюшку в начале раунда для вип игроков
// -
// Default: "1"
c_RoundMenu "1"




